site:
  name: Lyra Browser
  site: 'https://lyrabrowser.com'
  base: '/'
  trailingSlash: false
  googleSiteVerificationId: false

metadata:
  title:
    default: Lyra Browser
    template: '%s | Lyra Browser'
  description: 'Lyra Browser ships Seek, blocks ads, and keeps GPS and your home network off-limits. Maps still work.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Lyra Browser
    images:
      - url: '~/assets/images/lyra-mark.png'
        width: 512
        height: 512
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8
    post:
      isEnabled: true
      permalink: '/news/%slug%'
      robots:
        index: true
    list:
      isEnabled: true
      pathname: 'news'
      robots:
        index: true
    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false
    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
